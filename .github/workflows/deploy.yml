name: Build and deploy Ediova Workspace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  actions: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Keep production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ediova-workspace-dist
          path: ./dist
          if-no-files-found: error
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for GitHub's automatic branch-based Pages build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${GITHUB_REF_NAME}&per_page=50"
          for attempt in $(seq 1 36); do
            runs="$(curl --silent --show-error --fail \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "${api_url}")"
            status="$(printf '%s' "${runs}" | jq -r --arg sha "${GITHUB_SHA}" \
              '[.workflow_runs[] | select(.name == "pages build and deployment" and .head_sha == $sha) | .status][0] // empty')"
            if [ -z "${status}" ]; then
              echo "No competing branch-based Pages build was found for this commit."
              break
            fi
            if [ "${status}" = "completed" ]; then
              echo "The automatic branch-based build has finished; the Vite artifact will now be published last."
              break
            fi
            echo "Automatic Pages build is ${status}; waiting before publishing the Vite artifact (attempt ${attempt}/36)."
            if [ "${attempt}" -eq 36 ]; then
              echo "Timed out waiting for GitHub's competing branch-based Pages deployment."
              exit 1
            fi
            sleep 5
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published page and built assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          html_file="$(mktemp)"
          ready=0
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --location --output "$html_file" --write-out '%{http_code}' "$SITE_URL" || true)"
            if [ "$code" = "200" ] && grep -q '<div id="root"></div>' "$html_file"; then
              ready=1
              break
            fi
            echo "Attempt $attempt: waiting for published site (HTTP ${code:-unknown})"
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "The deployed home page did not return the expected HTML."
            head -c 3000 "$html_file" || true
            exit 1
          fi
          js_asset="$(grep -oE 'src="[^"]+[.]js"' "$html_file" | head -n1 | cut -d '"' -f2)"
          css_asset="$(grep -oE 'href="[^"]+[.]css"' "$html_file" | head -n1 | cut -d '"' -f2)"
          if [ -z "$js_asset" ] || [ -z "$css_asset" ]; then
            echo "Built JavaScript or CSS asset reference was missing from the deployed HTML."
            exit 1
          fi
          for asset in "$js_asset" "$css_asset"; do
            case "$asset" in
              http*) asset_url="$asset" ;;
              /*) asset_url="${SITE_URL%/}$asset" ;;
              *) asset_url="${SITE_URL%/}/$asset" ;;
            esac
            asset_code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$asset_url" || true)"
            echo "Asset $asset returned HTTP ${asset_code:-unknown}"
            if [ "$asset_code" != "200" ]; then
              echo "A required frontend asset is not being served: $asset_url"
              exit 1
            fi
          done
          echo "Published page and frontend assets are responding."

      - name: Verify browser renders the deployed app
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));

            const response = await page.goto(process.env.SITE_URL, {
              waitUntil: 'networkidle',
              timeout: 60000,
            });
            if (!response || response.status() !== 200) {
              throw new Error(`Live page returned HTTP ${response?.status() ?? 'no response'}`);
            }

            await page.waitForFunction(() => {
              const root = document.querySelector('#root');
              return Boolean(root && root.childElementCount > 0 && root.innerText.trim().length > 10);
            }, null, { timeout: 20000 });

            const bodyText = await page.locator('#root').innerText();
            console.log('Rendered page title:', await page.title());
            console.log('Rendered landing-page text:', bodyText.slice(0, 700).replace(/\\s+/g, ' '));

            if (!bodyText.includes('Make it') || !bodyText.includes('meaningful.')) {
              throw new Error('The Ediova landing page did not render its expected headline.');
            }
            if (!bodyText.toLowerCase().includes('workspace login')) {
              throw new Error('The workspace login control did not render.');
            }
            if (pageErrors.length) {
              throw new Error('Browser JavaScript errors: ' + pageErrors.join(' | '));
            }
            console.log('Browser smoke test passed: Ediova rendered and the workspace login control is present.');
          } finally {
            await browser.close();
          }
          NODE
